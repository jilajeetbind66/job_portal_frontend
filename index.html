<!doctype html>
<html lang="en" class="light scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vcreateventures – Find Jobs in India | Fresher, IT &amp; Remote Jobs</title>
    <meta name="description" content="Discover verified jobs in India across top tech companies and startups. Explore fresher jobs, IT jobs, software jobs, remote jobs, and internships on Vcreateventures." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vcreateventures.com/" />
    <meta name="theme-color" content="#6A8E7F" />

    <!-- Open Graph Metadata -->
    <meta property="og:site_name" content="Vcreateventures" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vcreateventures – Find Jobs in India | Fresher, IT &amp; Remote Jobs" />
    <meta property="og:description" content="Discover verified jobs in India across top tech companies and startups. Explore fresher jobs, IT jobs, software jobs, remote jobs, and internships on Vcreateventures." />
    <meta property="og:url" content="https://vcreateventures.com/" />
    <meta property="og:image" content="https://vcreateventures.com/logo.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@vcreateventures" />
    <meta name="twitter:title" content="Vcreateventures – Find Jobs in India | Fresher, IT &amp; Remote Jobs" />
    <meta name="twitter:description" content="Discover verified jobs in India across top tech companies and startups. Explore fresher jobs, IT jobs, software jobs, remote jobs, and internships on Vcreateventures." />
    <meta name="twitter:image" content="https://vcreateventures.com/logo.png" />

    <!-- Icons & Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Fonts & Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Global Organization & WebSite Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://vcreateventures.com/#organization",
            "name": "Vcreateventures",
            "url": "https://vcreateventures.com",
            "logo": "https://vcreateventures.com/logo.png",
            "sameAs": [
              "https://twitter.com/vcreateventures",
              "https://www.linkedin.com/company/vcreateventures"
            ],
            "description": "Vcreateventures connects ambitious talent with verified tech and corporate job opportunities across India and globally."
          },
          {
            "@type": "WebSite",
            "@id": "https://vcreateventures.com/#website",
            "url": "https://vcreateventures.com",
            "name": "Vcreateventures",
            "publisher": {
              "@id": "https://vcreateventures.com/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://vcreateventures.com/jobs?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#E0ECE1] text-[#2F3542] font-sans antialiased selection:bg-[#6A8E7F] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
